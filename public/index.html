<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebula Nav · 星云导航</title>
<meta name="color-scheme" content="dark">
<meta name="description" content="自托管的个人导航页：密码门禁、后台管理、内外网切换与密码保险箱。">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebula Nav">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090d16'/%3E%3Cpath d='M7 22c3.6-6.4 7-10 12-12.6' stroke='%234be1c0' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M7 26c4.2-6 8.4-9.6 15-13' stroke='%238b7bff' stroke-width='2.4' fill='none' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css?v=1.4.2">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ===================== 视图：密码门禁 ===================== -->
<div class="gate" id="gate">
  <div class="gate-panel">
    <div class="gate-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <defs>
          <linearGradient id="gateGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#4be1c0"></stop>
            <stop offset="1" stop-color="#8b7bff"></stop>
          </linearGradient>
        </defs>
        <path d="M4 17c3-6 6.4-9.4 10.6-11.4M4.6 20.4c3.6-5.6 7.6-8.8 13.2-11.6M8.8 21.6c3-3.6 6-5.8 10-7.8"
              fill="none" stroke="url(#gateGrad)" stroke-width="1.9" stroke-linecap="round"></path>
      </svg>
    </div>
    <h1 id="gateTitle">Nebula Nav</h1>
    <p class="lead">这是一页私有导航。输入访问密码后才会加载你的站点列表。</p>
    <form id="gateForm" autocomplete="off">
      <label class="field-label" for="gatePassword">访问密码</label>
      <input class="input" id="gatePassword" type="password" name="password" placeholder="请输入访问密码" autofocus>
      <p class="gate-error" id="gateError" role="alert"></p>
      <button class="btn btn-primary btn-block" id="gateSubmit" type="submit">进入导航</button>
    </form>
    <p class="gate-foot">密码与站点数据只保存在你自己的服务器上<span id="gateVersion"></span></p>
  </div>
</div>

<!-- ===================== 视图：导航页 ===================== -->
<div class="shell" id="shell" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#4be1c0"></stop>
              <stop offset="1" stop-color="#8b7bff"></stop>
            </linearGradient>
          </defs>
          <path d="M4 17c3-6 6.4-9.4 10.6-11.4M4.6 20.4c3.6-5.6 7.6-8.8 13.2-11.6M8.8 21.6c3-3.6 6-5.8 10-7.8"
                fill="none" stroke="url(#brandGrad)" stroke-width="1.9" stroke-linecap="round"></path>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name" id="brandName">Nebula Nav</span>
        <span class="brand-sub" id="brandSub">星云导航 · 自托管的起始页</span>
      </div>
    </div>

    <div class="top-actions">
      <span class="clock" id="clock" aria-label="当前时间"></span>
      <span class="visitor-ip" id="visitorIp" hidden></span>
      <span id="syncBadge" hidden></span>
      <select class="theme-select" id="themeSelect" aria-label="主题配色" title="切换主题配色">
        <option value="">跟随默认</option>
        <option value="nebula">星云</option>
        <option value="ocean">深海</option>
        <option value="forest">森林</option>
        <option value="dusk">暮光</option>
        <option value="sunset">落日</option>
        <option value="graphite">石墨</option>
        <option value="dawn">晨光（浅色）</option>
        <option value="paper">云白（浅色）</option>
      </select>
      <div class="mode-switch" id="modeSwitch" role="group" aria-label="网络模式">
        <button type="button" data-mode="auto" aria-pressed="false">自动</button>
        <button type="button" data-mode="lan" aria-pressed="true">内网</button>
        <button type="button" data-mode="wan" aria-pressed="false">公网</button>
      </div>
      <button class="icon-btn" id="densityBtn" type="button" aria-pressed="false" title="切换卡片密度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="5" width="7" height="6" rx="1.4"></rect><rect x="13" y="5" width="7" height="6" rx="1.4"></rect><rect x="4" y="13" width="7" height="6" rx="1.4"></rect><rect x="13" y="13" width="7" height="6" rx="1.4"></rect></svg>
        <span id="densityLabel">标准</span>
      </button>
      <a class="icon-btn" href="/admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke-linecap="round"></path><circle cx="16" cy="7" r="2.2"></circle><circle cx="10" cy="17" r="2.2"></circle></svg>
        管理
      </a>
      <button class="icon-btn" id="lockBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.4"></rect><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" stroke-linecap="round"></path></svg>
        锁定
      </button>
    </div>
  </header>

  <section class="welcome" id="welcome" aria-label="欢迎">
    <h2 class="welcome-greeting" id="greetingText"></h2>
    <button class="welcome-quote" id="quoteText" type="button" title="点击换一句"></button>
  </section>

  <section class="monitor" id="monitor" aria-label="系统状态">
    <div class="monitor-grid" id="monitorGrid">
      <div class="monitor-card" id="monitorCpu">
        <div class="monitor-card-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="2.2"></rect><rect x="8.5" y="8.5" width="7" height="7" rx="1"></rect><path d="M8.5 2v2.5M15.5 2v2.5M8.5 19.5V22M15.5 19.5V22M2 8.5h2.5M2 15.5h2.5M19.5 8.5H22M19.5 15.5H22" stroke-linecap="round"></path></svg>
          <span>CPU</span>
          <span class="monitor-cores" id="monitorCores"></span>
        </div>
        <div class="monitor-bar"><div class="monitor-bar-fill" id="monitorCpuBar"></div></div>
        <div class="monitor-num" id="monitorCpuVal">—</div>
      </div>
      <div class="monitor-card" id="monitorMem">
        <div class="monitor-card-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 11v2M11 11v2M15 11v2M19 11v2" stroke-linecap="round"></path></svg>
          <span>内存</span>
        </div>
        <div class="monitor-bar"><div class="monitor-bar-fill" id="monitorMemBar"></div></div>
        <div class="monitor-num" id="monitorMemVal">—</div>
      </div>
    </div>
    <div class="monitor-foot" id="monitorFoot"></div>
  </section>

  <section class="search-wrap" aria-label="站点搜索">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.2"></circle><path d="m16 16 4 4" stroke-linecap="round"></path></svg>
      <input id="searchInput" type="search" placeholder="搜索站点、描述或域名" aria-label="搜索站点" autocomplete="off">
      <select class="search-engine" id="engineSelect" aria-label="搜索引擎" title="选择搜索引擎"></select>
      <span class="search-kbd" aria-hidden="true">/</span>
    </div>
    <div class="search-meta">
      <span id="searchMeta">正在加载…</span>
      <span class="search-meta-actions">
        <button class="clear-btn" id="collapseAll" type="button">全部折叠</button>
        <button class="clear-btn" id="clearSearch" type="button" hidden>清除搜索</button>
      </span>
    </div>
  </section>

  <div class="filter-bar" id="filterBar" role="tablist" aria-label="按分类筛选"></div>

  <main class="content" id="content">
    <div class="empty">
      <strong>正在读取数据</strong>
      <p>站点列表由你自己的服务器提供。</p>
    </div>
  </main>

  <footer class="footer">
    <span id="footerLeft">Nebula Nav</span>
    <span id="footerCenter"></span>
    <span id="footerRight"></span>
  </footer>
</div>

<noscript>
  <div style="padding:28px;color:#8ea0b8">此页面需要启用 JavaScript 才能加载导航内容。</div>
</noscript>

<script src="assets/app.js?v=1.4.2" defer></script>
</body>
</html>
