services:
  aurora-nav:
    build: .
    container_name: aurora-nav
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      # 首次启动时生效；留空则用默认 123456 / admin123
      - FRONT_PASSWORD=${FRONT_PASSWORD:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 固定会话密钥后，重建容器不会让已登录设备掉线
      - SESSION_SECRET=${SESSION_SECRET:-}
      # 走 HTTPS 反代时设为 1
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
    volumes:
      - ./data:/data
    # 需要放进已有的反代网络时，取消注释并把服务接入网络
    # networks:
    #   - proxy
